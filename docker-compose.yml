services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # Unset by default so the API AUTO-DETECTS: real forecast store present
      # -> serve it; absent -> fall back to fixtures and say so via
      # meta.degraded. Set PHARMAPULSE_FIXTURES=1 to force the fallback (rung 5
      # of the degradation ladder, the switch to flip if the model layer dies).
      PHARMAPULSE_FIXTURES: "${PHARMAPULSE_FIXTURES:-}"
      PHARMAPULSE_DATA_ROOT: "/app/data/warehouse"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./contracts:/app/contracts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      # The browser talks to the Vite dev server, which proxies /api to the api
      # SERVICE - "localhost" inside this container is the web container itself.
      VITE_API_BASE: "/api"
      VITE_PROXY_TARGET: "http://api:8000"
    depends_on:
      - api

# No postgres. No redis. Deliberate - see team/05_INTEGRATION_DOCKER_OPS.md section 3.
# Analytical storage is Parquet read by DuckDB (no server, no port, no credentials).
# Operational storage is SQLite in the ./data volume.
