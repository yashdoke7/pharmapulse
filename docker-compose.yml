services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # Day 0-1: serve fixtures. Flip to 0 once the forecast store is real.
      PHARMAPULSE_FIXTURES: "${PHARMAPULSE_FIXTURES:-1}"
      PHARMAPULSE_DATA_ROOT: "/app/data/warehouse"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./contracts:/app/contracts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8000/api"
      VITE_USE_FIXTURES: "${VITE_USE_FIXTURES:-0}"
    depends_on:
      - api

# No postgres. No redis. Deliberate - see team/05_INTEGRATION_DOCKER_OPS.md section 3.
# Analytical storage is Parquet read by DuckDB (no server, no port, no credentials).
# Operational storage is SQLite in the ./data volume.
