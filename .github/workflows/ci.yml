name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Dataset
        # salesdaily.csv is committed (117 kB, public, no personal data), so CI
        # scores the same bytes a developer machine does. check_data.py asserts
        # the row count, the eight columns and the 26 closure days, and prints
        # the snapshot_id every reported number is tied to.
        run: python scripts/check_data.py
        env:
          PYTHONPATH: .
      - name: Build the pipeline
        # Full batch, not just gold: the replay tests and the business case
        # need the forecast store, and running the real thing in CI is the
        # point - a broken pipeline should fail the build, not the demo.
        run: python -m pipelines.run_nightly --stage all
        env:
          PYTHONPATH: .
      - name: Tests
        run: pytest -q
        env:
          PYTHONPATH: .
      - name: Benchmark
        # A model regression fails the build rather than surprising us later.
        # --fast runs 2 folds and the cheap models, so it stays under a minute.
        run: python scripts/day1_benchmark.py --fast --out /tmp/benchmarks.json
        env:
          PYTHONPATH: .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        run: npm ci || npm install
      - name: Build
        working-directory: web
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixtures are valid JSON and match the committed shapes
        run: |
          python -c "
          import json, pathlib, sys
          required = {'series','history','forecast','recommend','risk','explain','metrics','settings','health'}
          found = {p.stem for p in pathlib.Path('contracts/fixtures').glob('*.json')}
          missing = required - found
          assert not missing, f'missing fixtures: {missing}'
          for p in pathlib.Path('contracts/fixtures').glob('*.json'):
              obj = json.loads(p.read_text())
              assert 'data' in obj and 'meta' in obj, f'{p} is missing the envelope'
          print('fixtures ok:', sorted(found))
          "
